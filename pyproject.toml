[project]
name = "banlog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0"]

[project.scripts]
banlog = "banlog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banlog"]

[tool.hatch.build.targets.wheel.force-include]
"src/banlog/migrations" = "banlog/migrations"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "requests-mock>=1.11",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires nft binary and root"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
